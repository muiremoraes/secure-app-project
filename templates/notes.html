

<!DOCTYPE html>

<head>
    <title>Notes App</title>
</head>

<body>
    <h1>Notes App</h1>

    <a href="/logout">logout</a>
    <hr>

    <h3>Add here:</h3>

    <form method="post" action="/add_notes">
        <h5>Note:</h5> <textarea name="note_info"></textarea> <br>
        <br>
        <button type="submit">Submit</button>
    </form>

    <br>
    <hr>

    <h3>Notes:</h3>
    <ul>
    {% for note in notes %}
    <li>{{ note.note_info|safe }} <a href="/delete/{{ note.id }}">Delete</a></li>
    {% endfor %}
    </ul>



</body>

</html>
